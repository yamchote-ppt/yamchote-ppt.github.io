<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Discrete Mathematics — Ebook Reader</title>
    <meta name="description" content="Discrete Mathematics ebook reader by Phaphontee Yamchote">
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/font/flaticon.css">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b27;
            --bg-elevated: #1e2535;
            --accent-red: #E31C25;
            --text-primary: #e8edf2;
            --text-secondary: #8892a4;
            --border: rgba(255, 255, 255, 0.07);
            --radius-sm: 6px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        /* --- Navbar --- */
        .reader-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            height: 56px; display: flex; align-items: center;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }
        .reader-nav a.back-link {
            color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;
            display: flex; align-items: center; gap: 6px; transition: var(--transition);
        }
        .reader-nav a.back-link:hover { color: var(--text-primary); }
        .reader-nav .title {
            flex: 1; text-align: center; font-weight: 600; font-size: 0.95rem;
            color: var(--text-primary); letter-spacing: 0.3px;
        }
        .reader-nav .controls {
            display: flex; gap: 8px; align-items: center;
        }
        .reader-nav .controls button {
            background: var(--bg-elevated); border: 1px solid var(--border);
            color: var(--text-secondary); padding: 6px 12px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 0.8rem; transition: var(--transition);
        }
        .reader-nav .controls button:hover {
            color: var(--text-primary); border-color: rgba(255,255,255,0.2);
        }
        .reader-nav .page-info {
            color: var(--text-secondary); font-size: 0.8rem; min-width: 90px; text-align: center;
        }

        /* --- PDF Viewer Container --- */
        .reader-container {
            position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; background: #1a1a2e;
        }
        .reader-container::-webkit-scrollbar { width: 8px; }
        .reader-container::-webkit-scrollbar-track { background: var(--bg-primary); }
        .reader-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        #pdf-canvas-container {
            padding: 20px 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        #pdf-canvas-container canvas {
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            max-width: 100%;
        }

        /* Loading state */
        .loading-overlay {
            position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg-primary); z-index: 50;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--accent-red); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; color: var(--text-secondary); font-size: 0.9rem; }

        /* Responsive */
        @media (max-width: 768px) {
            .reader-nav .title { font-size: 0.8rem; }
            .reader-nav { padding: 0 12px; }
            .reader-nav .controls button { padding: 5px 8px; font-size: 0.75rem; }
        }

        /* Disable text selection on canvas area */
        #pdf-canvas-container { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="reader-nav">
        <a href="index.html" class="back-link">&#8592; Home</a>
        <div class="title">Discrete Mathematics</div>
        <div class="controls">
            <button id="btn-zoom-out" title="Zoom out">&#8722;</button>
            <span class="page-info" id="zoom-info">100%</span>
            <button id="btn-zoom-in" title="Zoom in">&#43;</button>
            <span style="color:var(--border); margin:0 4px;">|</span>
            <span class="page-info" id="page-info">Loading…</span>
        </div>
    </nav>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading ebook…</div>
    </div>

    <!-- PDF Render Area -->
    <div class="reader-container" id="reader-container">
        <div id="pdf-canvas-container"></div>
    </div>

    <!-- PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
    (function() {
        'use strict';

        // PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const PDF_URL = './assets/latex/week_material/discrete_week_material/book/main_discrete_sau.pdf';

        let pdfDoc = null;
        let currentScale = 1.5;
        const SCALE_STEP = 0.2;
        const MIN_SCALE = 0.5;
        const MAX_SCALE = 3.0;

        const container = document.getElementById('pdf-canvas-container');
        const readerContainer = document.getElementById('reader-container');
        const pageInfoEl = document.getElementById('page-info');
        const zoomInfoEl = document.getElementById('zoom-info');
        const loadingOverlay = document.getElementById('loading-overlay');

        // Render a single page
        function renderPage(page, canvas) {
            const viewport = page.getViewport({ scale: currentScale });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            return page.render({ canvasContext: ctx, viewport: viewport }).promise;
        }

        // Render all pages
        async function renderAllPages() {
            if (!pdfDoc) return;
            container.innerHTML = '';

            const renderPromises = [];
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const canvas = document.createElement('canvas');
                canvas.id = 'page-' + i;
                container.appendChild(canvas);

                renderPromises.push(
                    pdfDoc.getPage(i).then(page => renderPage(page, canvas))
                );
            }
            await Promise.all(renderPromises);
            pageInfoEl.textContent = pdfDoc.numPages + ' pages';
            zoomInfoEl.textContent = Math.round(currentScale / 1.5 * 100) + '%';
        }

        // Load PDF
        const loadingTask = pdfjsLib.getDocument({
            url: PDF_URL,
            disableAutoFetch: false,
            disableStream: false,
        });

        loadingTask.promise.then(function(pdf) {
            pdfDoc = pdf;
            loadingOverlay.style.display = 'none';
            renderAllPages();
        }).catch(function(err) {
            loadingOverlay.querySelector('.loading-text').textContent = 'Failed to load PDF.';
            console.error('PDF load error:', err);
        });

        // Zoom controls
        document.getElementById('btn-zoom-in').addEventListener('click', function() {
            if (currentScale < MAX_SCALE) {
                currentScale = Math.min(currentScale + SCALE_STEP, MAX_SCALE);
                renderAllPages();
            }
        });
        document.getElementById('btn-zoom-out').addEventListener('click', function() {
            if (currentScale > MIN_SCALE) {
                currentScale = Math.max(currentScale - SCALE_STEP, MIN_SCALE);
                renderAllPages();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === '+' || e.key === '=') {
                e.preventDefault();
                document.getElementById('btn-zoom-in').click();
            } else if (e.key === '-') {
                e.preventDefault();
                document.getElementById('btn-zoom-out').click();
            }
        });

        // --- Download Protection ---

        // Block right-click context menu
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // Block common download/save shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl+S, Ctrl+P, Ctrl+Shift+S
            if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P')) {
                e.preventDefault();
            }
        });

        // Block drag on canvases
        container.addEventListener('dragstart', function(e) { e.preventDefault(); });

    })();
    </script>
</body>
</html>
